name: Legatcy Cabinet Others Migration

on:
  workflow_dispatch:

jobs:
  migrate-others:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Migrate Cabinet other folders
        shell: pwsh
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          $AppId   = $env:APP_ID
          $Secret  = $env:APP_SECRET
          $LogFile = "legatcy_cabinet_others_log.csv"
          "Folder,SubFolder,File,Status,Error" | Set-Content $LogFile

          function Get-Token($tenant) {
              return (Invoke-RestMethod "https://login.microsoftonline.com/$tenant/oauth2/v2.0/token" -Method Post -Body @{
                  grant_type = "client_credentials"; client_id = $AppId; client_secret = $Secret
                  scope = "https://graph.microsoft.com/.default"
              }).access_token
          }
          function Get-AuthHeader($token) { return @{ Authorization = "Bearer $token" } }
          function Get-OrCreate-Folder($token, $driveId, $parentId, $folderName) {
              if ($folderName.Length -gt 100) { $folderName = $folderName.Substring(0, 100) }
              try {
                  $existing = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$driveId/items/$parentId/children" -Headers (Get-AuthHeader $token)
                  $found = $existing.value | Where-Object { $_.name -eq $folderName -and $_.folder }
                  if ($found) { return $found.id }
              } catch {}
              $body = @{ name = $folderName; folder = @{}; "@microsoft.graph.conflictBehavior" = "replace" } | ConvertTo-Json
              $created = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$driveId/items/$parentId/children" -Method Post -Headers (Get-AuthHeader $token) -Body $body -ContentType "application/json"
              return $created.id
          }
          function Copy-Items($srcDriveId, $srcFolderId, $destDriveId, $destParentId, $topFolder, $folderPath) {
              $items = @()
              $url = "https://graph.microsoft.com/v1.0/drives/$srcDriveId/items/$srcFolderId/children?`$top=200"
              while ($url) {
                  $script:srcToken = Get-Token "legatcy.onmicrosoft.com"
                  $r = Invoke-RestMethod $url -Headers (Get-AuthHeader $script:srcToken)
                  $items += $r.value
                  $url = $r.'@odata.nextLink'
              }
              foreach ($item in $items) {
                  if ($item.folder) {
                      $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                      $newFolderId = Get-OrCreate-Folder $script:destToken $destDriveId $destParentId $item.name
                      Copy-Items $srcDriveId $item.id $destDriveId $newFolderId $topFolder "$folderPath/$($item.name)"
                  } else {
                      try {
                          $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
                          $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                          $tmpPath = [System.IO.Path]::GetTempFileName()
                          Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$srcDriveId/items/$($item.id)/content" -Headers (Get-AuthHeader $script:srcToken) -OutFile $tmpPath -ErrorAction Stop
                          $fileName = $item.name
                          if ($fileName.Length -gt 150) {
                              $ext = [System.IO.Path]::GetExtension($fileName)
                              $base = [System.IO.Path]::GetFileNameWithoutExtension($fileName)
                              $fileName = $base.Substring(0, 150 - $ext.Length) + $ext
                          }
                          $upUrl = "https://graph.microsoft.com/v1.0/drives/$destDriveId/items/$destParentId`:/$fileName`:/content?@microsoft.graph.conflictBehavior=replace"
                          $bytes = [System.IO.File]::ReadAllBytes($tmpPath)
                          Invoke-RestMethod $upUrl -Method Put -Headers (Get-AuthHeader $script:destToken) -Body $bytes -ContentType "application/octet-stream" | Out-Null
                          Remove-Item $tmpPath -ErrorAction SilentlyContinue
                          Write-Host "[OK] $($item.name)"
                          Add-Content $LogFile "$topFolder,$folderPath,$($item.name),OK,"
                      } catch {
                          Write-Host "[ERR] $($item.name)"
                          Add-Content $LogFile "$topFolder,$folderPath,$($item.name),ERROR,$_"
                          Remove-Item $tmpPath -ErrorAction SilentlyContinue
                      }
                  }
              }
          }

          $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
          $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"

          $srcSite   = Invoke-RestMethod "https://graph.microsoft.com/v1.0/sites/legatcy.sharepoint.com:/sites/LegatcyOffice" -Headers (Get-AuthHeader $script:srcToken)
          $srcDrives = Invoke-RestMethod "https://graph.microsoft.com/v1.0/sites/$($srcSite.id)/drives" -Headers (Get-AuthHeader $script:srcToken)
          $srcDrive  = $srcDrives.value | Where-Object { $_.name -eq "Cabinet" }

          $destSite   = Invoke-RestMethod "https://graph.microsoft.com/v1.0/sites/sproutasiacom.sharepoint.com:/sites/TeamLegatcy" -Headers (Get-AuthHeader $script:destToken)
          $destDrives = Invoke-RestMethod "https://graph.microsoft.com/v1.0/sites/$($destSite.id)/drives" -Headers (Get-AuthHeader $script:destToken)
          $destDrive  = $destDrives.value | Where-Object { $_.name -eq "Documents" }

          $cabinetFolder = Get-OrCreate-Folder $script:destToken $destDrive.id "root" "Cabinet"

          $srcCabinet = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$($srcDrive.id)/root/children?`$top=200" -Headers (Get-AuthHeader $script:srcToken)
          $foldersToMigrate = $srcCabinet.value | Where-Object { $_.folder -and $_.name -ne "Companies" }

          Write-Host "Other Cabinet folders: $($foldersToMigrate.Count)"
          $foldersToMigrate | ForEach-Object { Write-Host "  - $($_.name)" }

          foreach ($folder in $foldersToMigrate) {
              Write-Host "`n[FOLDER] $($folder.name)"
              try {
                  $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
                  $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                  $destFolder = Get-OrCreate-Folder $script:destToken $destDrive.id $cabinetFolder $folder.name
                  Copy-Items $srcDrive.id $folder.id $destDrive.id $destFolder $folder.name $folder.name
                  Write-Host "[DONE] $($folder.name)"
              } catch {
                  Write-Host "[FAIL] $($folder.name) -- $_"
                  Add-Content $LogFile "$($folder.name),,,FAIL,$_"
              }
          }
          Write-Host "===== COMPLETE ====="

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-others-log
          path: legatcy_cabinet_others_log.csv
