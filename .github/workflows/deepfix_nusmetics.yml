name: Legatcy Cabinet Deep Fix - NUSMetics

on:
  workflow_dispatch:

jobs:
  deepfix-nusmetics:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Deep fix NUSMetics Pte. Ltd._Online
        shell: pwsh
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          $AppId       = $env:APP_ID
          $Secret      = $env:APP_SECRET
          $SrcDriveId  = "b!5ogB-g_vn0mOUWJtaPmZyk0rNIay469KkTS4lSORytaKitpcHMq_SrowGpvDyaQ1"
          $DestDriveId = "b!97JCsSNnaEy518vVPcfw0vboi8V4fc9Fhc6NdnhzY2bzImedhf4yT4A9Dho0XnEn"
          $CompanyName = "NUSMetics Pte. Ltd._Online"
          $LogFile     = "deepfix_nusmetics_log.csv"
          "Path,Item,Action,Error" | Set-Content $LogFile

          function Get-Token($tenant) {
              return (Invoke-RestMethod "https://login.microsoftonline.com/$tenant/oauth2/v2.0/token" -Method Post -Body @{
                  grant_type = "client_credentials"; client_id = $AppId; client_secret = $Secret
                  scope = "https://graph.microsoft.com/.default"
              }).access_token
          }
          function Get-AuthHeader($token) { return @{ Authorization = "Bearer $token" } }

          function Get-OrCreate-Folder($token, $driveId, $parentId, $folderName) {
              if ($folderName.Length -gt 100) { $folderName = $folderName.Substring(0, 100) }
              try {
                  $existing = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$driveId/items/$parentId/children?`$top=200" -Headers (Get-AuthHeader $token)
                  $found = $existing.value | Where-Object { $_.name -eq $folderName -and $_.folder }
                  if ($found) { return $found.id }
              } catch {}
              $body = @{ name = $folderName; folder = @{}; "@microsoft.graph.conflictBehavior" = "replace" } | ConvertTo-Json
              $created = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$driveId/items/$parentId/children" -Method Post -Headers (Get-AuthHeader $token) -Body $body -ContentType "application/json"
              return $created.id
          }

          function Upload-File($srcDriveId, $srcItemId, $destDriveId, $destParentId, $fileName) {
              $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
              $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
              $item  = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$srcDriveId/items/$srcItemId" -Headers (Get-AuthHeader $script:srcToken)
              $dlUrl = $item."@microsoft.graph.downloadUrl"
              $tmpPath = [System.IO.Path]::GetTempFileName()
              $wc = New-Object System.Net.WebClient
              $wc.Headers.Add("Authorization", "Bearer $($script:srcToken)")
              $wc.DownloadFile($dlUrl, $tmpPath)
              $actualSize = (Get-Item $tmpPath).Length
              if ($actualSize -le 4mb) {
                  $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                  $upUrl = "https://graph.microsoft.com/v1.0/drives/$destDriveId/items/$destParentId`:/$fileName`:/content?@microsoft.graph.conflictBehavior=replace"
                  $fs = [System.IO.File]::OpenRead($tmpPath)
                  $webReq = [System.Net.WebRequest]::Create($upUrl)
                  $webReq.Method = "PUT"
                  $webReq.Headers.Add("Authorization", "Bearer $($script:destToken)")
                  $webReq.ContentType = "application/octet-stream"
                  $webReq.ContentLength = $actualSize
                  $reqStream = $webReq.GetRequestStream()
                  $fs.CopyTo($reqStream)
                  $reqStream.Close()
                  $fs.Close()
                  $resp = $webReq.GetResponse()
                  $resp.Close()
              } else {
                  $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                  $sessionBody = @{ item = @{ "@microsoft.graph.conflictBehavior" = "replace"; name = $fileName } } | ConvertTo-Json
                  $sessionUrl  = "https://graph.microsoft.com/v1.0/drives/$destDriveId/items/$destParentId`:/$fileName`:/createUploadSession"
                  $session     = Invoke-RestMethod $sessionUrl -Method Post -Headers (Get-AuthHeader $script:destToken) -Body $sessionBody -ContentType "application/json"
                  $uploadUrl   = $session.uploadUrl
                  $fs          = [System.IO.File]::OpenRead($tmpPath)
                  $chunkSize   = 5mb
                  $buf         = New-Object byte[] $chunkSize
                  $offset      = 0
                  while ($offset -lt $actualSize) {
                      $read  = $fs.Read($buf, 0, $chunkSize)
                      $chunk = $buf[0..($read-1)]
                      $end   = $offset + $read - 1
                      $hdrs  = @{ "Content-Range" = "bytes $offset-$end/$actualSize"; "Content-Length" = "$read" }
                      Invoke-RestMethod $uploadUrl -Method Put -Headers $hdrs -Body $chunk | Out-Null
                      $offset += $read
                  }
                  $fs.Close()
              }
              Remove-Item $tmpPath -ErrorAction SilentlyContinue
          }

          function Sync-Folder($srcDriveId, $srcFolderId, $destDriveId, $destParentId, $folderPath) {
              $srcItems = @()
              $url = "https://graph.microsoft.com/v1.0/drives/$srcDriveId/items/$srcFolderId/children?`$top=200"
              while ($url) {
                  $script:srcToken = Get-Token "legatcy.onmicrosoft.com"
                  $r = Invoke-RestMethod $url -Headers (Get-AuthHeader $script:srcToken)
                  $srcItems += $r.value
                  $url = $r."@odata.nextLink"
              }
              $destItems = @()
              try {
                  $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                  $url = "https://graph.microsoft.com/v1.0/drives/$destDriveId/items/$destParentId/children?`$top=200"
                  while ($url) {
                      $r = Invoke-RestMethod $url -Headers (Get-AuthHeader $script:destToken)
                      $destItems += $r.value
                      $url = $r."@odata.nextLink"
                  }
              } catch {}
              $destNames = $destItems.name

              foreach ($item in $srcItems) {
                  if ($item.folder) {
                      $existing = $destItems | Where-Object { $_.name -eq $item.name -and $_.folder }
                      if ($existing) {
                          $destFolderId = $existing.id
                          Write-Host "[FOLDER EXISTS] $folderPath/$($item.name)"
                      } else {
                          $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                          $destFolderId = Get-OrCreate-Folder $script:destToken $destDriveId $destParentId $item.name
                          Write-Host "[FOLDER CREATED] $folderPath/$($item.name)" -ForegroundColor Yellow
                          Add-Content $LogFile "$folderPath,$($item.name),FOLDER_CREATED,"
                      }
                      Sync-Folder $srcDriveId $item.id $destDriveId $destFolderId "$folderPath/$($item.name)"
                  } else {
                      if ($destNames -contains $item.name) {
                          Write-Host "[SKIP] $folderPath/$($item.name)"
                      } else {
                          try {
                              $fileName = $item.name
                              if ($fileName.Length -gt 150) {
                                  $ext  = [System.IO.Path]::GetExtension($fileName)
                                  $base = [System.IO.Path]::GetFileNameWithoutExtension($fileName)
                                  $fileName = $base.Substring(0, 150 - $ext.Length) + $ext
                              }
                              Upload-File $srcDriveId $item.id $destDriveId $destParentId $fileName
                              Write-Host "[OK] $folderPath/$($item.name)" -ForegroundColor Green
                              Add-Content $LogFile "$folderPath,$($item.name),UPLOADED,"
                          } catch {
                              Write-Host "[ERR] $folderPath/$($item.name) -- $_" -ForegroundColor Red
                              Add-Content $LogFile "$folderPath,$($item.name),ERROR,$_"
                          }
                      }
                  }
              }
          }

          $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
          $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"

          # Get source company folder
          $companyEncoded = [Uri]::EscapeDataString($CompanyName)
          $srcCompanyUrl  = "https://graph.microsoft.com/v1.0/drives/$SrcDriveId/root:/Companies/$companyEncoded"
          $srcCompany     = Invoke-RestMethod $srcCompanyUrl -Headers (Get-AuthHeader $script:srcToken)
          Write-Host "Source folder: $($srcCompany.name) | Items: $($srcCompany.folder.childCount)" -ForegroundColor Cyan

          # Get dest company folder
          $destCompaniesFolder = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$DestDriveId/root:/Legatcy Office/Cabinet1/Companies" -Headers (Get-AuthHeader $script:destToken)
          $destCompanies = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$DestDriveId/items/$($destCompaniesFolder.id)/children?`$top=200" -Headers (Get-AuthHeader $script:destToken)
          $destCompany   = $destCompanies.value | Where-Object { $_.name -eq $CompanyName }

          if (-not $destCompany) {
              Write-Host "Dest folder missing — creating" -ForegroundColor Red
              $destCompanyId = Get-OrCreate-Folder $script:destToken $DestDriveId $destCompaniesFolder.id $CompanyName
          } else {
              $destCompanyId = $destCompany.id
              Write-Host "Dest folder: $($destCompany.name) | Items: $($destCompany.folder.childCount)" -ForegroundColor Cyan
          }

          Write-Host "Starting deep sync for: $CompanyName" -ForegroundColor Magenta
          Sync-Folder $SrcDriveId $srcCompany.id $DestDriveId $destCompanyId $CompanyName
          Write-Host "===== DONE =====" -ForegroundColor Green

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepfix-nusmetics-log
          path: deepfix_nusmetics_log.csv
