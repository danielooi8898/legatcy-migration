name: Legatcy OneDrive Migration

on:
  workflow_dispatch:

jobs:
  migrate-onedrive:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Migrate all user OneDrives
        shell: pwsh
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          $AppId   = $env:APP_ID
          $Secret  = $env:APP_SECRET
          $LogFile = "legatcy_onedrive_log.csv"
          "User,Path,File,Status,Error" | Set-Content $LogFile

          function Get-Token($tenant) {
              return (Invoke-RestMethod "https://login.microsoftonline.com/$tenant/oauth2/v2.0/token" -Method Post -Body @{
                  grant_type = "client_credentials"; client_id = $AppId; client_secret = $Secret
                  scope = "https://graph.microsoft.com/.default"
              }).access_token
          }
          function Get-AuthHeader($token) { return @{ Authorization = "Bearer $token" } }

          function Get-OrCreate-Folder($token, $driveId, $parentId, $folderName) {
              if ($folderName.Length -gt 100) { $folderName = $folderName.Substring(0, 100) }
              try {
                  $existing = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$driveId/items/$parentId/children" -Headers (Get-AuthHeader $token)
                  $found = $existing.value | Where-Object { $_.name -eq $folderName -and $_.folder }
                  if ($found) { return $found.id }
              } catch {}
              $body = @{ name = $folderName; folder = @{}; "@microsoft.graph.conflictBehavior" = "replace" } | ConvertTo-Json
              $created = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$driveId/items/$parentId/children" -Method Post -Headers (Get-AuthHeader $token) -Body $body -ContentType "application/json"
              return $created.id
          }

          function Copy-Items($srcDriveId, $srcFolderId, $destDriveId, $destParentId, $userName, $folderPath) {
              $items = @()
              $url = "https://graph.microsoft.com/v1.0/drives/$srcDriveId/items/$srcFolderId/children?`$top=200"
              while ($url) {
                  $script:srcToken = Get-Token "legatcy.onmicrosoft.com"
                  $r   = Invoke-RestMethod $url -Headers (Get-AuthHeader $script:srcToken)
                  $items += $r.value
                  $url = $r.'@odata.nextLink'
              }
              foreach ($item in $items) {
                  if ($item.folder) {
                      $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                      $newFolderId = Get-OrCreate-Folder $script:destToken $destDriveId $destParentId $item.name
                      Copy-Items $srcDriveId $item.id $destDriveId $newFolderId $userName "$folderPath/$($item.name)"
                  } else {
                      try {
                          $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
                          $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"
                          $tmpPath = [System.IO.Path]::GetTempFileName()
                          Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$srcDriveId/items/$($item.id)/content" -Headers (Get-AuthHeader $script:srcToken) -OutFile $tmpPath -ErrorAction Stop
                          $fileName = $item.name
                          if ($fileName.Length -gt 150) {
                              $ext  = [System.IO.Path]::GetExtension($fileName)
                              $base = [System.IO.Path]::GetFileNameWithoutExtension($fileName)
                              $fileName = $base.Substring(0, 150 - $ext.Length) + $ext
                          }
                          $upUrl = "https://graph.microsoft.com/v1.0/drives/$destDriveId/items/$destParentId`:/$fileName`:/content?@microsoft.graph.conflictBehavior=replace"
                          $bytes = [System.IO.File]::ReadAllBytes($tmpPath)
                          Invoke-RestMethod $upUrl -Method Put -Headers (Get-AuthHeader $script:destToken) -Body $bytes -ContentType "application/octet-stream" | Out-Null
                          Remove-Item $tmpPath -ErrorAction SilentlyContinue
                          Write-Host "[OK] $folderPath/$($item.name)"
                          Add-Content $LogFile "$userName,$folderPath,$($item.name),OK,"
                      } catch {
                          Write-Host "[ERR] $folderPath/$($item.name) -- $_"
                          Add-Content $LogFile "$userName,$folderPath,$($item.name),ERROR,$_"
                          Remove-Item $tmpPath -ErrorAction SilentlyContinue
                      }
                  }
              }
          }

          $userMappings = @(
              @{ SrcUser = "jolie_tran_legatcy_com";       DestUpn = "jolie.tran@accpro.co" },
              @{ SrcUser = "dennis_legatcy_com";            DestUpn = "dennis.poh@accpro.co" },
              @{ SrcUser = "billy_tan_legatcy_com";         DestUpn = "billy.tan@accpro.co" },
              @{ SrcUser = "irene_legatcy_com";             DestUpn = "irene.zeng@accpro.co" },
              @{ SrcUser = "azlina_aziz_legatcy_com";       DestUpn = "azlina.aziz@accpro.co" },
              @{ SrcUser = "keith_wee_legatcy_com";         DestUpn = "keith.wee@accpro.co" },
              @{ SrcUser = "lakshmi_legatcy_com";           DestUpn = "lakshmi.latha@accpro.co" },
              @{ SrcUser = "raizuly_legatcy_com";           DestUpn = "raizuly.ahmad@accpro.co" },
              @{ SrcUser = "gisel_swe_legatcy_com";         DestUpn = "gisel.swe@accpro.co" },
              @{ SrcUser = "noura_legatcy_com";             DestUpn = "noura.zainal@accpro.co" },
              @{ SrcUser = "ella_yamin_legatcy_com";        DestUpn = "ella.yamin@accpro.co" },
              @{ SrcUser = "aini_putri_legatcy_com";        DestUpn = "aini.putri@accpro.co" },
              @{ SrcUser = "sarda_pandiangan_legatcy_com";  DestUpn = "sarda.pandiangan@accpro.co" },
              @{ SrcUser = "nada_salma_legatcy_com";        DestUpn = "nada.salma@accpro.co" },
              @{ SrcUser = "riska_amalia_legatcy_com";      DestUpn = "riska.amalia@accpro.co" }
          )

          foreach ($user in $userMappings) {
              Write-Host "`n===== USER: $($user.DestUpn) =====" 
              try {
                  $script:srcToken  = Get-Token "legatcy.onmicrosoft.com"
                  $script:destToken = Get-Token "sproutasiacom.onmicrosoft.com"

                  # Get source OneDrive
                  $srcSite   = Invoke-RestMethod "https://graph.microsoft.com/v1.0/sites/legatcy-my.sharepoint.com:/personal/$($user.SrcUser)" -Headers (Get-AuthHeader $script:srcToken)
                  $srcDrives = Invoke-RestMethod "https://graph.microsoft.com/v1.0/sites/$($srcSite.id)/drives" -Headers (Get-AuthHeader $script:srcToken)
                  $srcDrive  = $srcDrives.value | Where-Object { $_.name -eq "OneDrive" }

                  if (-not $srcDrive) {
                      Write-Host "[SKIP] No OneDrive found"
                      continue
                  }

                  # Get source root count
                  $srcRoot  = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$($srcDrive.id)/root" -Headers (Get-AuthHeader $script:srcToken)
                  $srcItems = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$($srcDrive.id)/root/children?`$top=200" -Headers (Get-AuthHeader $script:srcToken)
                  $srcCount = $srcItems.value.Count

                  # Get destination
                  $enc           = [Uri]::EscapeDataString($user.DestUpn)
                  $destUserDrive = Invoke-RestMethod "https://graph.microsoft.com/v1.0/users/$enc/drive" -Headers (Get-AuthHeader $script:destToken)
                  $destDriveId   = $destUserDrive.id

                  # Check if already fully done
                  try {
                      $destItems = Invoke-RestMethod "https://graph.microsoft.com/v1.0/drives/$destDriveId/root:/Legatcy Onedrive:/children?`$top=200" -Headers (Get-AuthHeader $script:destToken)
                      $destCount = $destItems.value.Count
                  } catch { $destCount = 0 }

                  if ($srcCount -eq $destCount) {
                      Write-Host "[SKIP] Already fully migrated ($srcCount/$destCount items match)"
                      continue
                  }

                  Write-Host "[MIGRATE] $srcCount src vs $destCount dest — copying missing items"

                  $legatcyFolder = Get-OrCreate-Folder $script:destToken $destDriveId "root" "Legatcy Onedrive"
                  Copy-Items $srcDrive.id $srcRoot.id $destDriveId $legatcyFolder $user.DestUpn $user.DestUpn

                  Write-Host "[DONE] $($user.DestUpn)"
              } catch {
                  Write-Host "[FAIL] $($user.DestUpn) -- $_"
                  Add-Content $LogFile "$($user.DestUpn),,,FAIL,$_"
              }
          }

          Write-Host "===== ONEDRIVE MIGRATION COMPLETE ====="

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onedrive-migration-log
          path: legatcy_onedrive_log.csv
